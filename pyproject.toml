[project]
name = "FinProject"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "clickhouse-connect>=1.12.0",
    "dagster==1.13.29",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "FinProject"
registry_modules = [
    "FinProject.components.*",
]


